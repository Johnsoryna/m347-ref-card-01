name: Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/app-refcard-01

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t app-refcard-01 .

      - name: Test image
        run: |
          docker run -d --name refcard01 -p 8080:8080 app-refcard-01
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080 | grep "Application Ref. Card 01"
          curl -sf http://localhost:8080/api | grep "API hello"
          docker rm -f refcard01

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag app-refcard-01 $IMAGE:latest
          docker tag app-refcard-01 $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
